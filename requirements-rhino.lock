# EXACT versions, for reproducing a known-good Rhino environment.
#
# requirements.txt carries RANGES, so every machine re-resolves and can land on a
# different set -- which is how one developer ends up with a package another has
# never seen. This file is the resolution that was actually tested: 174 tests, a
# real CRA solve, and the reference arch reproducing to 4 significant figures.
#
# Install with --no-deps so pip installs exactly this and resolves nothing:
#
#   SE=$(echo ~/.rhinocode/py39-rh8/site-envs/brg-csd-*)
#   ~/.rhinocode/py39-rh8/python3.9 -m pip install \
#       --target "$SE" --no-deps --upgrade -r requirements-rhino.lock
#
# NOTE the site-env is SHARED by every BRG plugin declaring `# venv: brg-csd`
# (RhinoVAULT, FormFinder, IGS). Its contents therefore depend on what else is
# installed, which is the other reason two machines differ. Installing this list
# adds and upgrades what COMPAS Masonry needs and leaves the rest alone.
#
# compas_viewer / PySide6 are deliberately ABSENT: compas_lmgc90 declares
# compas_viewer as a hard dependency rather than a viz extra, which pulls 1.1 GB
# of Qt that nothing in this plugin imports.
#
# Regenerate after a deliberate upgrade; do not hand-edit.
